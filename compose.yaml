services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Inside Compose, services reach each other by service name.
      DATABASE_URL: postgresql+asyncpg://rateforge:rateforge@postgres:5432/rateforge
      REDIS_URL: redis://redis:6379/0
      # Integration tests create this database on demand and rebuild its tables per test.
      TEST_DATABASE_URL: postgresql+asyncpg://rateforge:rateforge@postgres:5432/rateforge_test
      # Redis database 15 is wiped between tests; the app itself uses database 0.
      TEST_REDIS_URL: redis://redis:6379/15
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./scripts:/app/scripts
    # Apply migrations, then start the server with auto-reload for development.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  # A second gateway instance sharing the same Postgres and Redis. Used to demonstrate that
  # rate limits are enforced across instances (see scripts/demo_rate_limit.py).
  api2:
    build: .
    ports:
      - "8001:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rateforge:rateforge@postgres:5432/rateforge
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # A small upstream service to try the gateway against (see scripts/echo_app.py).
  echo:
    build: .
    command: uvicorn --app-dir scripts echo_app:app --host 0.0.0.0 --port 9000
    volumes:
      - ./scripts:/app/scripts

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rateforge
      POSTGRES_PASSWORD: rateforge
      POSTGRES_DB: rateforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rateforge -d rateforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
