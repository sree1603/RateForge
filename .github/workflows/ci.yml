name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, migrations, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rateforge
          POSTGRES_PASSWORD: rateforge
          POSTGRES_DB: rateforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rateforge -d rateforge"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://rateforge:rateforge@localhost:5432/rateforge
      TEST_DATABASE_URL: postgresql+asyncpg://rateforge:rateforge@localhost:5432/rateforge_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/15
      # CI-only values, not secrets: they protect nothing outside this throwaway job.
      API_KEY_HMAC_SECRET: ci-only-hmac-secret-0123456789abcdef0123456789
      ADMIN_TOKEN: ci-only-admin-token-0123456789
      # Fail (instead of silently skipping) if a service container is not reachable.
      REQUIRE_SERVICES: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Formatting
        run: ruff format --check .

      - name: Migrations apply to an empty database
        run: alembic upgrade head

      - name: Migrations match the models (no drift)
        run: alembic check

      - name: Migrations can be reversed and reapplied
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Tests with coverage
        run: pytest --cov=app --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=90

      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Create the local environment file
        run: cp .env.example .env

      - name: Build and start the stack
        run: docker compose up -d --build --wait api echo

      - name: Seed plans, a demo route and a demo API key
        run: |
          docker compose run --rm -T api python scripts/seed.py --demo-key | tee seed.out
          KEY=$(grep -o 'rf_[A-Za-z0-9_-]*' seed.out | head -1)
          test -n "$KEY"
          echo "DEMO_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Smoke test through the gateway
        run: docker compose run --rm -T api python scripts/smoke_test.py --key "$DEMO_KEY"

      - name: Show logs if anything failed
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Clean up
        if: always()
        run: docker compose down -v
